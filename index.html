<!DOCTYPE html>
<!--
  Game level selector homepage.
  Low displays low.jpg and links to game 2; High displays high.jpg and links to the original game.
  This page is static and requires only a browser plus the external font/CDN resources below.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Story: Crazy Pumpkin Car Race</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* Game selector theme: colorful toy-console styling shared by both levels. */
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            font-family: 'Quicksand', sans-serif;
            background-color: #3b82f6;
            background-image:
                radial-gradient(#ec4899 20%, transparent 20%),
                radial-gradient(#f472b6 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }
        .font-toy { font-family: 'Fredoka One', cursive; }
        .frog-case {
            position: relative;
            width: min(100%, 980px);
            padding: 54px 28px 30px;
            border: 12px solid #1f4e09;
            border-radius: 52px;
            background: linear-gradient(145deg, #7ad832, #47a016);
            box-shadow: 0 24px 48px rgba(0,0,0,.4), inset 0 8px 18px rgba(255,255,255,.45), inset 0 -8px 16px rgba(0,0,0,.35);
        }
        .frog-eye {
            position: absolute;
            top: -58px;
            width: 108px;
            height: 108px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 8px solid #1f4e09;
            border-radius: 50%;
            background: linear-gradient(145deg, #7ad832, #47a016);
            box-shadow: 0 10px 20px rgba(0,0,0,.3);
        }
        .frog-eye-left { left: 14%; }
        .frog-eye-right { right: 14%; }
        .frog-pupil {
            width: 74px;
            height: 74px;
            position: relative;
            border: 4px solid #fff;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #1e293b, #090d16);
        }
        .frog-pupil::after {
            content: '';
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            box-shadow: -10px 12px 0 -4px #fff;
        }
        .level-card {
            transition: transform .2s ease, filter .2s ease;
        }
        .level-card:hover {
            transform: translateY(-6px) rotate(-1deg);
            filter: brightness(1.08);
        }
        @media (max-width: 640px) {
            body { padding: 10px; }
            .frog-case { padding: 44px 14px 18px; border-width: 8px; border-radius: 34px; }
            .frog-eye { width: 72px; height: 72px; top: -42px; border-width: 6px; }
            .frog-pupil { width: 48px; height: 48px; border-width: 3px; }
            .frog-pupil::after { top: 7px; right: 7px; width: 16px; height: 16px; box-shadow: -7px 9px 0 -3px #fff; }
        }
    </style>
</head>
<body>
    <main class="frog-case">
        <div class="frog-eye frog-eye-left" aria-hidden="true"><div class="frog-pupil"></div></div>
        <div class="frog-eye frog-eye-right" aria-hidden="true"><div class="frog-pupil"></div></div>

        <section class="rounded-[2rem] border-4 border-amber-300 bg-blue-900/90 p-5 text-center shadow-2xl sm:p-8">
            <p class="mb-2 text-sm font-bold uppercase tracking-[0.25em] text-sky-200">Toy Story Racing Arcade</p>
            <h1 class="font-toy text-3xl leading-tight text-amber-300 drop-shadow-[0_4px_0_rgba(0,0,0,0.8)] sm:text-5xl">
                CRAZY PUMPKIN CAR RACE
            </h1>
            <p class="mx-auto mt-3 max-w-xl text-sm font-semibold text-white sm:text-base">
                Choose your challenge and jump into the toy-box race!
            </p>

            <div class="mt-7 grid gap-4 sm:grid-cols-2">
                <a class="level-card overflow-hidden rounded-3xl border-4 border-emerald-200 bg-gradient-to-br from-emerald-400 via-green-500 to-lime-600 text-slate-950 shadow-[0_7px_0_#166534]" href="high/">
                    <img class="h-40 w-full object-cover sm:h-48" src="low.jpg" alt="Low level preview">
                    <div class="p-4">
                    <h2 class="font-toy mt-2 text-3xl">LOW</h2>
                    <p class="mt-1 font-bold">Game 2 challenge</p>
                    <span class="mt-4 inline-block rounded-xl border-2 border-white/70 bg-white/80 px-5 py-2 font-toy text-lg">PLAY LOW ▶</span>
                    </div>
                </a>

                <a class="level-card overflow-hidden rounded-3xl border-4 border-fuchsia-200 bg-gradient-to-br from-fuchsia-500 via-purple-600 to-indigo-700 text-white shadow-[0_7px_0_#4c1d95]" href="low/">
                    <img class="h-40 w-full object-cover sm:h-48" src="high.jpg" alt="High level preview">
                    <div class="p-4">
                    <h2 class="font-toy mt-2 text-3xl text-amber-200">HIGH</h2>
                    <p class="mt-1 font-bold">Original pumpkin race</p>
                    <span class="mt-4 inline-block rounded-xl border-2 border-amber-200 bg-amber-300 px-5 py-2 font-toy text-lg text-slate-950">PLAY HIGH ▶</span>
                    </div>
                </a>
            </div>

            <p class="mt-6 text-xs font-semibold text-sky-200">Tap a level to begin • Space / Arrow Up to jump</p>
        </section>
    </main>
</body>
</html>
